[package]
name = "popcorn"
version = "0.2.1"
edition = "2024"

[dependencies]
gpui-kit = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
geo = { version = "0.33.1", default-features = false, features = ["earcut", "use-serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
